<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="cdeb-relay-token" content="">
<title>CDE Registry browser</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--faint:#8a8a85;--line:#e2e0d8;--line2:#d6d4cc;--acc:#2f5d8a;--accs:#e6eef6;--acc2:#c9d8e8;--chg:#fff1b8;--warn:#a8432a;--warnbg:#fbeae6;--ok:#2e7d4f;--okbg:#e4f0e6;--note:#f4f1e6;--notel:#d8c88f;--l2:#7a3fa0;--l2s:#f6f0fa;--l2l:#d9c8e6;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13.5px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh}
/* top bar */
#topbar{display:flex;align-items:center;gap:14px;padding:0 14px;height:50px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#topbar h1{font-size:15px;margin:0;white-space:nowrap}
.tabs{display:flex;background:#f1f0eb;border-radius:6px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:4px 12px;border-radius:4px;color:#555;font-size:12.5px}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.searchwrap{position:relative;flex:1;max-width:520px}
#search{width:100%;padding:6px 10px;border:1px solid var(--line2);border-radius:6px;background:#fff}
#results{position:absolute;top:36px;left:0;right:0;background:#fff;border:1px solid var(--line2);border-radius:6px;max-height:65vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:40}
#results .r{padding:6px 10px;border-bottom:1px solid #f0efe9;cursor:pointer;font-size:12.5px}
#results .r.hi,#results .r:hover{background:var(--accs)}
#results .r .f{font-weight:600}
#results .r .p{color:var(--mute);font-size:11.5px}
#results .r mark{background:#ffe27a;padding:0}
.pill{font-size:11.5px;border-radius:10px;padding:2px 8px;border:1px solid var(--line2);background:#fff;white-space:nowrap;cursor:pointer}
.pill.ok{border-color:#9cc9ad;color:var(--ok);background:var(--okbg)}
.pill.bad{border-color:#e3b1a4;color:var(--warn);background:var(--warnbg)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line2);background:#fff;border-radius:5px;padding:3px 8px;font-size:12px}
.iconbtn:hover{border-color:var(--acc)}
.btn{border:1px solid var(--line2);background:#fff;border-radius:5px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.pri:disabled{background:#9db3c9;border-color:#9db3c9}
.btn.on{background:var(--accs);border-color:var(--acc)}
.btn.small{padding:2px 7px;font-size:11.5px}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{border:0;background:none;color:var(--acc);padding:0 2px;font-size:12px}
.linkbtn:hover{text-decoration:underline}
.linkbtn.warn{color:var(--warn)}
/* layout */
#main{flex:1;display:flex;min-height:0}
#library{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#center{flex:1;overflow:auto;min-width:0}
#side{width:310px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 14px}
.libhead{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.libhead .row1{display:flex;gap:6px;align-items:center}
.libhead input[type=text]{width:100%;padding:5px 8px;border:1px solid var(--line2);border-radius:5px}
.libhead select{padding:3px 4px;border:1px solid var(--line2);border-radius:5px;background:#fff;font-size:12px}
.libhead .meta{font-size:11.5px;color:var(--mute)}
.liblist{overflow:auto;flex:1;padding:4px 0 30px}
.grp{font-size:11px;font-weight:700;color:var(--mute);padding:8px 12px 3px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
.item{padding:5px 12px 5px 14px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:#faf9f6}
.item.on{background:var(--accs);border-left-color:var(--acc)}
.item .l{font-size:13px;font-weight:600;word-break:break-word}
.item .m{font-size:11px;color:var(--mute)}
.badge{display:inline-block;font-size:10.5px;border-radius:8px;padding:0 6px;margin-left:4px;vertical-align:1px}
.badge.edit{background:var(--chg);color:#7a5a00}
.badge.err{background:var(--warnbg);color:var(--warn)}
.badge.fmt{background:#eee;color:#555}
.badge.staged{background:#e3effa;color:#1d5a8c}
/* welcome */
.welcome{max-width:760px;margin:60px auto;padding:0 24px}
.welcome h2{font-size:22px;margin:0 0 8px}
.welcome p{color:#444}
.welcome code{font-family:var(--mono);background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
.welcome .acts{display:flex;gap:10px;margin:18px 0}
.progress{margin-top:14px;color:var(--mute)}
/* sheet */
.sheet{padding:18px 22px 80px;display:flex;flex-direction:column;gap:14px;min-width:0}
.split{display:flex;gap:0;min-height:100%}
.split>.pane{flex:1;min-width:0;border-right:1px solid var(--line)}
.split>.pane:last-child{border-right:0}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shead h2{margin:0;font-size:20px;word-break:break-all}
.shead .fn{color:var(--mute);font-size:12px}
.tag{font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:1px 6px;background:#fff;color:#555}
.banner{border-radius:6px;padding:8px 12px;font-size:12.5px}
.banner.warn{background:var(--warnbg);border:1px solid #e9c3b8;color:#6b2b18}
.banner.info{background:var(--accs);border:1px solid var(--acc2)}
.card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.card>h3{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .sub{text-transform:none;letter-spacing:0;font-weight:400}
.row{display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px;padding:3px 0;border-bottom:1px dashed #efede6;align-items:start}
.row:last-child{border-bottom:0}
.row>.k{font-size:12px;color:var(--mute);padding-top:2px;word-break:break-word}
.row>.k .q{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ecebe5;color:#777;font-size:10px;text-align:center;line-height:14px;margin-left:4px;cursor:help}
.row>.val{min-width:0}
.sub2{font-size:11.5px;color:var(--mute)}
.block{border:1px solid var(--acc2);background:#fbfcfe;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.block.fb{background:#fff;border-color:var(--line2);margin-left:18px}
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;user-select:none}
.bhead .t{font-weight:700;color:var(--acc);font-size:13.5px}
.bhead .s{color:var(--mute);font-size:12px}
.bhead .acts{margin-left:auto;display:flex;gap:4px}
.target{border:1px solid var(--l2l);background:var(--l2s);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.target .bhead .t{color:var(--l2)}
.subhead{font-size:12px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.subhead .sub2{font-weight:400}
/* values */
.v{font-family:var(--mono);font-size:12.5px;border-radius:3px;padding:1px 3px;cursor:text;word-break:break-word;white-space:pre-wrap;display:inline-block;min-width:14px;min-height:18px}
.v:hover{background:var(--accs);outline:1px solid var(--acc2)}
.v.txt{font-family:inherit;font-size:13px}
.v.null{color:#aaa}
.v.empty{color:#aaa;font-style:italic}
.v.num{color:#0b5f8f}
.v.ro{cursor:default}
.v.ro:hover{background:none;outline:0}
.v.changed,.changed{background:var(--chg)!important}
.v.bad{color:var(--warn);background:var(--warnbg)}
.tog{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:0 9px;font-family:var(--mono);font-size:12px}
.tog.t{background:var(--okbg);border-color:#9cc9ad;color:var(--ok)}
.tog.f{background:#f3f2ed}
.edwrap{display:inline-flex;gap:4px;align-items:flex-start;width:100%;max-width:100%}
.edwrap input,.edwrap textarea{flex:1;min-width:80px;font-family:var(--mono);font-size:12.5px;padding:2px 5px;border:1px solid var(--acc);border-radius:4px;background:#fff;outline:2px solid var(--accs)}
.edwrap textarea{font-family:inherit;font-size:13px;line-height:1.45;resize:vertical}
.edwrap select{font-size:11px;padding:1px;border:1px solid var(--line2);border-radius:4px;background:#fff}
.ederr{color:var(--warn);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;font-family:var(--mono);font-size:12px;background:#eef2f6;border:1px solid #d6e0ea;border-radius:10px;padding:0 3px 0 8px;max-width:100%}
.chip .x{border:0;background:none;color:#999;padding:0 3px;font-size:12px}
.chip .x:hover{color:var(--warn)}
.chip.bad{background:var(--warnbg);border-color:#e9c3b8}
.chipadd{border:1px dashed var(--line2);border-radius:10px;padding:0 8px;font-size:12px;min-width:90px;width:110px;font-family:var(--mono)}
.concept{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc2);background:#f5f9fc;border-radius:5px;padding:2px 8px;cursor:pointer;max-width:100%;text-align:left}
.concept:hover{border-color:var(--acc)}
.concept .cn{font-weight:600;font-size:12.5px;word-break:break-word}
.concept .ci{font-family:var(--mono);font-size:11.5px;color:#555;white-space:nowrap}
.concept.none{border-style:dashed;color:var(--acc);background:#fff;font-size:12px}
.ck{font-size:11.5px;margin-left:6px}
.ck.ok{color:var(--ok)}.ck.warn{color:var(--warn)}.ck.unknown{color:var(--faint)}
/* tables */
.tw{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:5px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{text-align:left;font-size:11px;font-weight:700;color:#555;background:#f3f2ed;padding:4px 7px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t th .warnc{color:var(--warn);font-weight:400}
table.t td{padding:3px 7px;border-bottom:1px solid #f0efe9;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.missing td{background:var(--warnbg)}
table.t tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
table.t td.acts{white-space:nowrap;width:1%;text-align:right}
table.t td.hv{font-family:var(--mono);font-size:12.5px}
.rowacts button{border:0;background:none;color:#aaa;padding:0 3px;font-size:12.5px}
.rowacts button:hover{color:var(--acc)}
.rowacts button.del:hover{color:var(--warn)}
.flagtxt{font-size:11px;color:var(--warn)}
.tablebar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.tablebar input{padding:2px 6px;border:1px solid var(--line2);border-radius:4px;font-size:12px}
.ph{font-family:var(--mono);font-size:12px;border-radius:4px;padding:0 5px;background:#efe9f7;color:var(--l2)}
/* grain + keys panels */
.gpanel{border:1px solid var(--acc2);background:#fff;border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.gpanel.l2{border-color:var(--l2l)}
.gtitle{font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src{font-size:11px;font-weight:400;border-radius:4px;padding:1px 6px;border:1px solid var(--line2);background:#f7f6f2}
.src.block{background:var(--okbg);border-color:#9cc9ad;color:var(--ok)}
.src.element,.src.one_per{background:#fff6dd;border-color:#e6cf8a;color:#7a5a00}
.src.none{background:var(--warnbg);border-color:#e9c3b8;color:var(--warn)}
.chain{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.gbox{border:1px solid var(--acc2);background:#f5f9fc;border-radius:5px;padding:6px 8px;width:190px;display:flex;flex-direction:column;gap:2px}
.gbox.proc{background:#f7f6f2;border-color:var(--line);width:160px}
.gbox .gl{font-size:10.5px;color:var(--acc)}
.gbox.proc .gl{color:var(--faint)}
.gbox .gv{font-weight:700;font-size:13px;word-break:break-word}
.gbox .gh{font-size:11px;color:#555}
.garrow{align-self:center;font-size:11px;font-weight:700;color:var(--mute);white-space:nowrap}
.reads{font-size:12.5px}
.legend{font-size:11.5px;color:var(--mute)}
.res{font-size:12.5px}
.res.ok{color:var(--ok)}.res.warn{color:var(--warn)}.res.unknown{color:var(--mute)}
/* notes */
.note{background:var(--note);border-left:3px solid var(--notel);padding:4px 8px;font-size:12.5px;margin-top:3px;white-space:pre-wrap}
.note .nk{display:block;font-family:var(--mono);font-size:11px;color:#8a6d1f}
/* side panel */
#side h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
#side h3:first-child{margin-top:0}
.status{font-size:12.5px;padding:6px 8px;border-radius:5px;background:#f3f2ed}
.status.dirty{background:var(--chg)}
.status.ok{background:var(--okbg);color:var(--ok)}
.status.err{background:var(--warnbg);color:var(--warn)}
.chg{font-size:12px;border-bottom:1px solid #f0efe9;padding:4px 0;word-break:break-word}
.chg .p{font-family:var(--mono);font-size:11px;color:var(--acc);cursor:pointer}
.chg .b{color:#999;text-decoration:line-through}
.chg .rv{float:right}
.sideacts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
/* clusters */
.cl{display:flex;height:100%;min-height:0}
.clctl{width:330px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.clctl h4{margin:8px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.clctl label{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;cursor:pointer}
.clctl input[type=number]{width:60px;padding:1px 4px;border:1px solid var(--line2);border-radius:4px}
.clctl select{padding:2px;border:1px solid var(--line2);border-radius:4px;background:#fff;font-size:12px}
.cli{padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.cli:hover{background:#faf9f6}
.cli.on{background:var(--accs)}
.cli.rev{color:var(--faint)}
.cli .n{margin-left:auto;font-size:11.5px;color:var(--mute);white-space:nowrap}
.cldetail{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
td.tint{background:var(--okbg)}
/* popover + modal + toast */
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:560px;max-width:calc(100vw - 20px);max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.pop h4{margin:0;font-size:13px}
.pop .grid2{display:grid;grid-template-columns:150px 1fr;gap:4px 8px;align-items:center;font-size:12px}
.pop .grid2 input{padding:2px 6px;border:1px solid var(--line2);border-radius:4px;font-family:var(--mono);font-size:12px}
.pop .srch{display:flex;gap:6px}
.pop .srch input{flex:1;padding:5px 8px;border:1px solid var(--line2);border-radius:5px}
.pop .doms{display:flex;flex-wrap:wrap;gap:4px;font-size:11.5px}
.pop .doms label{border:1px solid var(--line2);border-radius:10px;padding:0 7px;cursor:pointer}
.pop .doms label.on{background:var(--accs);border-color:var(--acc)}
.hit{border:1px solid var(--line);border-radius:5px;padding:5px 8px;cursor:pointer}
.hit:hover{border-color:var(--acc);background:#f8fbfe}
.hit .hn{font-weight:600}
.hit .hm{font-family:var(--mono);font-size:11px;color:#555}
.hit.nonstd{opacity:.6}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:70;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:8px;padding:16px 18px;width:620px;max-width:calc(100vw - 30px);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h3{margin:0;font-size:15px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}
.modal textarea{width:100%;min-height:260px;font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-radius:5px;padding:6px}
#toast{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:#1d1d1b;color:#fff;border-radius:6px;padding:7px 12px;font-size:12.5px;max-width:420px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.toast.err{background:var(--warn)}
.toast.ok{background:var(--ok)}
/* raw */
.raw textarea{width:100%;min-height:60vh;font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:8px;line-height:1.4;tab-size:2}
.diff{font-family:var(--mono);font-size:12px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:65vh}
.diff div{white-space:pre;padding:0 8px}
.diff .a{background:#e6f4ea}.diff .d{background:#fbe9e7}.diff .h{background:#f3f2ed;color:var(--mute)}
.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%{background:#ffe27a}100%{background:transparent}}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fff}
.muted{color:var(--mute)}
.mono{font-family:var(--mono)}
.sha{font-family:var(--mono);font-size:11.5px}
/* ── additions for the build ── */
[hidden]{display:none!important}
#center.splitmode{overflow:hidden}
.split{height:100%}
.split>.pane{overflow:auto;height:100%}
.cl{height:100%}
.row .kdel{visibility:hidden;margin-left:2px}
.row:hover>.k .kdel{visibility:visible}
.sf .kdel{visibility:hidden}.sf:hover .kdel{visibility:visible}
.absent{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;padding:4px 0 2px}
.absent.inl{display:inline-flex;padding:0}
.addf{border:1px dashed var(--line2);background:#fff;border-radius:10px;padding:0 7px;font-size:11.5px;color:var(--acc)}
.addf:hover{border-color:var(--acc);background:var(--accs)}
.subf{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.sf{display:inline-flex;align-items:baseline;gap:2px;flex-wrap:wrap}
.sk{font-size:11px;color:var(--mute)}
.nest{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line);padding-left:8px}
.nest>.row{grid-template-columns:150px minmax(0,1fr)}
.nrow{display:flex;gap:6px;align-items:flex-start}
.others{margin-top:4px;border-top:1px dashed var(--line2);padding-top:4px}
.tblock{display:flex;flex-direction:column;gap:4px;min-width:0}
.colsel{font-size:11.5px;padding:1px 3px;border:1px dashed var(--line2);border-radius:4px;background:#fff;color:var(--acc)}
.l1{display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--acc2);padding-left:10px}
.bhead .tw2{color:var(--mute);width:12px;display:inline-block}
.block.lk{border-color:var(--line2);background:#fffdf7}
.l2c{display:flex;align-items:flex-start;gap:2px}
.l2c .cm{border:0;background:none;color:#bbb;padding:0 2px;font-size:11px;visibility:hidden}
td:hover .l2c .cm{visibility:visible}
.l2c .cm:hover{color:var(--l2)}
.v.ph{background:#efe9f7;color:var(--l2)}
table.l2t td{min-width:90px}
table.l2t td.hv{min-width:130px}

<script id="core">
/* CDE Registry browser — core logic (no DOM).
   Runs in the page (window.Core) and in Node (module.exports), so the same code
   can be checked against every mapping file outside the browser. */
(function (root, factory) {
  const Core = factory();
  if (typeof module === 'object' && module.exports) module.exports = Core;
  else root.Core = Core;
})(typeof self !== 'undefined' ? self : this, function () {
'use strict';
const Core = {};

/* ───────────────────────── paths ───────────────────────── */
const pk = p => JSON.stringify(p);
Core.pk = pk;
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
Core.isObj = isObj;
Core.get = function (o, p) {
  for (const k of p) { if (o === null || typeof o !== 'object') return undefined; o = o[k]; }
  return o;
};
Core.has = function (o, p) {
  if (!p.length) return true;
  const parent = Core.get(o, p.slice(0, -1));
  if (parent === null || typeof parent !== 'object') return false;
  const k = p[p.length - 1];
  return Array.isArray(parent) ? (k >= 0 && k < parent.length) : Object.prototype.hasOwnProperty.call(parent, k);
};
function setKey(obj, k, v) {
  if (k === '__proto__') Object.defineProperty(obj, k, { value: v, enumerable: true, writable: true, configurable: true });
  else obj[k] = v;
}
Core.set = function (o, p, v) {
  if (!p.length) throw new Error('empty path');
  const parent = Core.get(o, p.slice(0, -1));
  if (parent === null || typeof parent !== 'object') throw new Error('no container at ' + Core.pathStr(p.slice(0, -1)));
  setKey(parent, p[p.length - 1], v);
};
Core.del = function (o, p) {
  const parent = Core.get(o, p.slice(0, -1));
  if (parent === null || typeof parent !== 'object') return;
  const k = p[p.length - 1];
  if (Array.isArray(parent)) parent.splice(k, 1); else delete parent[k];
};
Core.insert = function (o, arrPath, index, v) {
  const arr = Core.get(o, arrPath);
  if (!Array.isArray(arr)) throw new Error('not a list at ' + Core.pathStr(arrPath));
  arr.splice(Math.max(0, Math.min(index, arr.length)), 0, v);
};
Core.pathStr = function (p) {
  let s = '';
  p.forEach((k, i) => { s += typeof k === 'number' ? '[' + k + ']' : (i ? '.' : '') + k; });
  return s;
};
Core.clone = v => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));

/* ───────────────────── JSON text: read and write in the file's own format ─────────────────────
   Every file in the registry is written by Python json.dump(indent=2): ", " and ": " separators,
   no escaping of non-ASCII unless ensure_ascii was on, numbers such as 132.0 spelled with ".0".
   The reader records each number's exact spelling and the file's layout so the writer reproduces
   the file byte for byte where nothing changed. */
Core.parseJSONText = function (text) {
  let i = 0;
  const n = text.length;
  const rawNums = new Map(), keyOrder = new Map(), dupKeys = [];
  const path = [];
  const NUM = /-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/y;
  const INTKEY = /^(?:0|[1-9]\d{0,9})$/;
  function err(msg) {
    const before = text.slice(0, i);
    const line = before.split('\n').length;
    const col = i - before.lastIndexOf('\n');
    const e = new SyntaxError(msg + ' at line ' + line + ', column ' + col);
    e.line = line; e.col = col; e.pos = i;
    throw e;
  }
  function ws() {
    while (i < n) {
      const c = text.charCodeAt(i);
      if (c === 32 || c === 10 || c === 13 || c === 9) i++; else break;
    }
  }
  function str() {
    const start = i; i++;
    while (i < n) {
      const c = text.charCodeAt(i);
      if (c === 34) { i++; try { return JSON.parse(text.slice(start, i)); } catch (e) { i = start; err('Bad string escape'); } }
      if (c === 92) i += 2;
      else if (c < 32) err('Control character inside a string');
      else i++;
    }
    err('Unterminated string');
  }
  function val() {
    ws();
    if (i >= n) err('Unexpected end of file');
    const c = text[i];
    if (c === '{') return obj();
    if (c === '[') return arr();
    if (c === '"') return str();
    if (c === 't' && text.startsWith('true', i)) { i += 4; return true; }
    if (c === 'f' && text.startsWith('false', i)) { i += 5; return false; }
    if (c === 'n' && text.startsWith('null', i)) { i += 4; return null; }
    NUM.lastIndex = i;
    const m = NUM.exec(text);
    if (m) {
      i += m[0].length;
      const v = Number(m[0]);
      if (String(v) !== m[0]) rawNums.set(pk(path), m[0]);
      return v;
    }
    err('Unexpected character ' + JSON.stringify(c));
  }
  function obj() {
    i++;
    const o = {};
    const order = [];
    let intKeys = false;
    ws();
    if (text[i] === '}') { i++; return o; }
    for (;;) {
      ws();
      if (text[i] !== '"') err('Expected a key in double quotes');
      const k = str();
      ws();
      if (text[i] !== ':') err("Expected ':' after a key");
      i++;
      path.push(k);
      const v = val();
      path.pop();
      if (Object.prototype.hasOwnProperty.call(o, k)) dupKeys.push(Core.pathStr(path.concat([k])));
      else order.push(k);
      setKey(o, k, v);
      if (INTKEY.test(k)) intKeys = true;
      ws();
      if (text[i] === ',') { i++; continue; }
      if (text[i] === '}') { i++; break; }
      err("Expected ',' or '}'");
    }
    if (intKeys) keyOrder.set(pk(path), order);
    return o;
  }
  function arr() {
    i++;
    const a = [];
    ws();
    if (text[i] === ']') { i++; return a; }
    for (;;) {
      path.push(a.length);
      a.push(val());
      path.pop();
      ws();
      if (text[i] === ',') { i++; continue; }
      if (text[i] === ']') { i++; break; }
      err("Expected ',' or ']'");
    }
    return a;
  }
  if (text.charCodeAt(0) === 0xFEFF) i = 1;
  const value = val();
  ws();
  if (i < n) err('Unexpected text after the end of the JSON');
  return { value, meta: { rawNums, keyOrder, dupKeys, style: Core.detectStyle(text) } };
};

Core.detectStyle = function (text) {
  const bom = text.charCodeAt(0) === 0xFEFF;
  const eol = text.indexOf('\r\n') >= 0 ? '\r\n' : '\n';
  const trailingNewline = /\n$/.test(text);
  let indent = null;
  const body = bom ? text.slice(1) : text;
  const m = body.match(/^[[{][ \t]*\r?\n([ \t]+)\S/);
  if (m) indent = m[1];
  else if (/\n/.test(body.trim())) { const m2 = body.match(/\n([ \t]+)\S/); indent = m2 ? m2[1] : '  '; }
  let ensureAscii = false;
  if (!/[^\x00-\x7f]/.test(body) && /\\u(?:00[89a-fA-F][0-9a-fA-F]|0[1-9a-fA-F][0-9a-fA-F]{2}|[1-9a-fA-F][0-9a-fA-F]{3})/.test(body)) ensureAscii = true;
  const keySep = indent === null ? (/"\s*:\s/.test(body) ? ': ' : ':') : ': ';
  const itemSep = indent === null ? (/[\]}"\d el],\s/.test(body) ? ', ' : ',') : ',';
  return { bom, eol, trailingNewline, indent, ensureAscii, keySep, itemSep };
};

Core.DEFAULT_STYLE = { bom: false, eol: '\n', trailingNewline: true, indent: '  ', ensureAscii: false, keySep: ': ', itemSep: ',' };

Core.quoteJSON = function (s, ascii) {
  let out = '"';
  let run = 0;
  for (let j = 0; j < s.length; j++) {
    const c = s.charCodeAt(j);
    let esc = null;
    if (c === 0x22) esc = '\\"';
    else if (c === 0x5c) esc = '\\\\';
    else if (c === 0x0a) esc = '\\n';
    else if (c === 0x0d) esc = '\\r';
    else if (c === 0x09) esc = '\\t';
    else if (c === 0x08) esc = '\\b';
    else if (c === 0x0c) esc = '\\f';
    else if (c < 0x20 || (ascii && c > 0x7e)) esc = '\\u' + c.toString(16).padStart(4, '0');
    if (esc !== null) { out += s.slice(run, j) + esc; run = j + 1; }
  }
  return out + s.slice(run) + '"';
};

Core.stringifyJSON = function (value, meta) {
  const st = (meta && meta.style) || Core.DEFAULT_STYLE;
  const raw = (meta && meta.rawNums) || new Map();
  const ko = (meta && meta.keyOrder) || new Map();
  const ascii = st.ensureAscii, ind = st.indent, eol = st.eol;
  const path = [];
  function num(v) {
    const r = raw.get(pk(path));
    if (r !== undefined && Number(r) === v) return r;
    if (!isFinite(v)) return 'null';
    return String(v);
  }
  function ser(v, depth) {
    if (v === null || v === undefined) return 'null';
    switch (typeof v) {
      case 'boolean': return v ? 'true' : 'false';
      case 'number': return num(v);
      case 'string': return Core.quoteJSON(v, ascii);
      case 'object': {
        if (Array.isArray(v)) {
          if (!v.length) return '[]';
          const parts = [];
          for (let j = 0; j < v.length; j++) { path.push(j); parts.push(ser(v[j], depth + 1)); path.pop(); }
          if (ind === null) return '[' + parts.join(st.itemSep) + ']';
          const pad = eol + ind.repeat(depth + 1);
          return '[' + pad + parts.join(',' + pad) + eol + ind.repeat(depth) + ']';
        }
        let keys = Object.keys(v);
        const ord = ko.get(pk(path));
        if (ord) {
          const have = new Set(keys), seen = new Set(), ks = [];
          for (const k of ord) if (have.has(k) && !seen.has(k)) { ks.push(k); seen.add(k); }
          for (const k of keys) if (!seen.has(k)) ks.push(k);
          keys = ks;
        }
        keys = keys.filter(k => v[k] !== undefined);
        if (!keys.length) return '{}';
        const parts = keys.map(k => { path.push(k); const s = Core.quoteJSON(k, ascii) + st.keySep + ser(v[k], depth + 1); path.pop(); return s; });
        if (ind === null) return '{' + parts.join(st.itemSep) + '}';
        const pad = eol + ind.repeat(depth + 1);
        return '{' + pad + parts.join(',' + pad) + eol + ind.repeat(depth) + '}';
      }
    }
    return 'null';
  }
  let out = ser(value, 0);
  if (st.trailingNewline) out += eol;
  if (st.bom) out = '﻿' + out;
  return out;
};

/* Line diff (common prefix/suffix trimmed, LCS on the middle). Returns null when too large. */
Core.lineDiff = function (aText, bText, limit) {
  const a = aText.split('\n'), b = bText.split('\n');
  let s = 0;
  while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let ea = a.length, eb = b.length;
  while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
  const A = a.slice(s, ea), B = b.slice(s, eb);
  if (A.length * B.length > (limit || 4e6)) return null;
  const m = A.length, nB = B.length;
  const dp = Array.from({ length: m + 1 }, () => new Uint32Array(nB + 1));
  for (let x = m - 1; x >= 0; x--) for (let y = nB - 1; y >= 0; y--) dp[x][y] = A[x] === B[y] ? dp[x + 1][y + 1] + 1 : Math.max(dp[x + 1][y], dp[x][y + 1]);
  const ops = [];
  let x = 0, y = 0;
  while (x < m && y < nB) {
    if (A[x] === B[y]) { ops.push({ t: '=', a: s + x, b: s + y, line: A[x] }); x++; y++; }
    else if (dp[x + 1][y] >= dp[x][y + 1]) { ops.push({ t: '-', a: s + x, line: A[x] }); x++; }
    else { ops.push({ t: '+', b: s + y, line: B[y] }); y++; }
  }
  while (x < m) { ops.push({ t: '-', a: s + x, line: A[x] }); x++; }
  while (y < nB) { ops.push({ t: '+', b: s + y, line: B[y] }); y++; }
  return { prefix: s, ops, aLines: a, bLines: b, changed: ops.filter(o => o.t !== '=').length };
};

/* ───────────────────────── knowledge from the 2.7 template ───────────────────────── */
const K = Core.K = {};

K.ELEMENT_FIELDS = [
  ['registry_id', "The element's minted registry id (an integer). It is not the label; blank until minted."],
  ['registry_label', "The element's column name in the Layer 1 tables and the name Layer 2 reads. 'label' always means a column name."],
  ['harmonized_element_curie', "The element's Layer 1 vocabulary identity (e.g. LOINC:<code>), chosen first; it can differ from the Layer 2 defining concept."],
  ['definition', "What the element means: the provider's own dictionary text; the LOINC long common name where no provider dictionary exists; harmonized prose only when the element spans programs or files."],
  ['registry_etl_version', "Version of this element's mapping; bumped on any change that alters the Layer 1 output."],
  ['registry_etl_version_date', 'The date the version was set (YYYY-MM-DD).'],
  ['programs_covered', 'Every AMP program a source block below belongs to.'],
  ['modality', 'The data modality the element describes (clinical, scRNAseq, proteomics, wgs, ...).'],
  ['harmonized_values', "The element's declared value domain: what every source block's value map normalises onto. Enumerated values, never free text; '<any in range>' for a continuous measure."],
  ['must_agree', 'Blocks that produce a value for the same key must reconcile. Off = a silent tie-break (the first block read wins).'],
  ['null_is_agreement', 'A blank from one block is not a disagreement.'],
  ['on_conflict', 'What happens when blocks still differ: qc_flag, collapse_if_equal, or prefer:<source_label>.'],
  ['harmonized_with', 'Elements merged into this one (records the merge).'],
  ['load_id', "A name for the load job this element's targets are emitted in."],
  ['shape', 'A named requirement profile (declared; nothing enforces it yet).'],
  ['conflicts', 'Written by the loader when blocks disagree under qc_flag. Authored empty.']

K.ELEMENT_HELP = Object.fromEntries(K.ELEMENT_FIELDS);
K.OLDER_ELEMENT_FIELDS = {
  one_per: "Older grain field: one value per person / visit / specimen. Grain is now declared on every source block as loading_grain.",
  loading_grain: 'Older placement: grain declared once for the whole file. The template puts loading_grain on every source block.',
  unit: 'Unit declared for the whole file. The template declares the unit on each source block (layer_1_etl.unit).',
  status_note: 'Free prose about the file. The 2.7 template has status_note on source blocks and targets, not on the element.'
};
K.ELEMENT_KNOWN = new Set(['schema_version', 'sources', 'sysbio_etl', 'links', 'policies'].concat(K.ELEMENT_FIELDS.map(f => f[0])));

K.BLOCK_FIELDS = [
  ['source_name', 'A short handle so a note, a link or a fallback can point at this block.'],
  ['program', 'The AMP program this source belongs to.'],
  ['study', 'The study or cohort within the program.'],
  ['description', 'What this source is: the file, the sheet, the provider, the version.'],
  ['source_label', "The provider's column label, exactly as it appears in the file. One column per block."],
  ['status', 'Review state of this block: draft, pending, approved, rejected.'],
  ['status_note', 'Free prose, not read by the ETL.'],
  ['reviewed_by', 'Who reviewed the block.'],
  ['reviewed_on', 'When the block was reviewed.'],
  ['manual_approval', 'Approved by a person rather than generated.'],
  ['dictionary', "The provider's data dictionary document: file_name, checksum, sourced_from."],
  ['src_dictionary', 'The dictionary entry (or entries) that define this column.'],
  ['src_definition', "The provider's definition text, verbatim (errors annotated in a note, never corrected)."],
  ['layout', 'How to find the column inside the file: file_type, sheet, table.'],
  ['loading_grain', 'The grain: what this value is a fact about, and the Layer 1 table it lands on.'],
  ['precedence', 'Order among blocks producing a value for the same key: 1 is read first, higher fills only where every lower one is blank.'],
  ['applies_to_rows', 'Which rows this block reads (deterministic conditions on columns of this source).'],
  ['extract', 'Deterministic extraction: one source field split into several Layer 1 columns.'],
  ['layer_1_etl', 'Value form, datatype, missing values, range, unit, pinned data files and the value map.'],
  ['fallback', 'A complete lower-precedence block, used only where this block yields no value for the key.']

K.BLOCK_HELP = Object.fromEntries(K.BLOCK_FIELDS);
K.L1_FIELDS = [
  ['value_form', "Decided from the provider's dictionary, never inferred from the values."],
  ['datatype', "Copied from the provider's own type."],
  ['unit', 'The unit as the provider writes it; written beside the value as <label>_unit.'],
  ['range', "The dictionary's permissible range (continuous only); out-of-range is reported, never dropped."],
  ['missing_values', 'Sentinels this file uses (99, -9, NA); thrown out before any parse or range check.'],
  ['data_files', 'The file pin: identity only (file, accession, hash, access group). sha256 first.'],

K.VM_COLUMNS = ['source_value', 'source_encoding', 'harmonized_value', 'harmonized_encoding', 'harmonized_ord', 'harmonized_curie', 'interval', 'note'];
K.VM_HELP = {

  source_encoding: 'The code the file pairs with it, or null.',
  harmonized_value: 'The harmonized value it means: one of harmonized_values.',
  harmonized_encoding: 'The harmonized code, only where a code system exists (instrument scores); never minted.',
  harmonized_ord: 'Orders an ordinal set.',

K.DATA_FILE_COLUMNS = ['file', 'source_id', 'id_type', 'sha256', 'access_groups', 'sheet'];
K.CONDITION_COLUMNS = ['column', 'match', 'token', 'inequality', 'token_position', 'delimiters'];
K.EXTRACT_COLUMNS = ['label', 'delimiters', 'token_position', 'token', 'into'];

K.RA_COLUMNS = ['role', 'link_id', 'column', 'status', 'note'];
K.OVS_COLUMNS = ['concept_id', 'concept_name'];

K.LINK_COLUMNS = ['link_id', 'kind', 'linked_element_label', 'linked_element_id', 'linked_table', 'linked_defining_concept', 'linked_value_set', 'linking_mechanism', 'linking_mechanism_concept_id', 'inverse_concept_id', 'note'];
K.LINK_HELP = {
  link_id: 'Unique in this file; what record_attributes.link_id points at.',
  kind: "derivation = the linked row is this row's source or product in a chain; realized = the linked row is the context this row's fact was produced in.",
  linked_element_label: 'registry_label of the element whose target this links to (may be this element).',
  linked_element_id: "That element's registry id (optional).",

/* ───────────────────────── reading a mapping file ───────────────────────── */
const str = v => (typeof v === 'string' ? v : (v === null || v === undefined ? '' : String(v)));
Core.str = str;
const uniq = a => Array.from(new Set(a.filter(x => x !== '' && x !== null && x !== undefined)));
Core.uniq = uniq;

Core.isConcept = function (v) {
  return isObj(v) && (('id' in v) || ('concept_id' in v)) && (('name' in v) || ('concept_name' in v));
};
Core.conceptOf = function (v) {
  if (!isObj(v)) return null;
  return { id: 'id' in v ? v.id : v.concept_id, name: 'name' in v ? v.name : v.concept_name, domain: v.domain, vocabulary: v.vocabulary_id || v.vocabulary };
};

/* Every source block, including fallbacks nested inside blocks, in reading order. */
Core.blocks = function (root) {
  const out = [];
  const srcs = isObj(root) && Array.isArray(root.sources) ? root.sources : [];
  function visit(b, p, depth, topIndex) {
    if (!isObj(b)) return;
    out.push({ block: b, path: p, depth, topIndex });
    if (isObj(b.fallback)) visit(b.fallback, p.concat('fallback'), depth + 1, topIndex);
  }
  srcs.forEach((b, i) => visit(b, ['sources', i], 0, i));
  return out;
};
Core.blockLabels = function (b) {
  if (!isObj(b)) return [];
  const l = b.source_label;
  if (typeof l === 'string') return l ? [l] : [];
  if (Array.isArray(l)) return l.filter(x => typeof x === 'string' && x);
  return [];
};
Core.blockPins = function (b) {
  const l1 = isObj(b) && isObj(b.layer_1_etl) ? b.layer_1_etl : null;
  const files = l1 && Array.isArray(l1.data_files) ? l1.data_files : [];
  return files.filter(isObj).map(f => {
    const sha = str(f.sha256), sid = str(f.source_id), name = str(f.file);
    const key = sha ? 'sha256:' + sha : sid ? 'id:' + sid : name ? 'file:' + name : '';
    const short = sid ? sid : sha ? sha.slice(0, 12) + '…' : name;
    return { key, sha256: sha, source_id: sid, file: name, id_type: str(f.id_type), short };
  }).filter(p => p.key);
};
Core.valueMap = b => (isObj(b) && isObj(b.layer_1_etl) && Array.isArray(b.layer_1_etl.value_map) ? b.layer_1_etl.value_map : []);
Core.targets = root => (isObj(root) && Array.isArray(root.sysbio_etl) ? root.sysbio_etl : []);
Core.labelOf = function (root, fallbackName) {
  if (isObj(root)) {
    if (typeof root.registry_label === 'string' && root.registry_label) return root.registry_label;
    if (typeof root.harmonized_element_label === 'string' && root.harmonized_element_label) return root.harmonized_element_label;
  }
  return (fallbackName || '').replace(/\.json$/i, '');
};
Core.allHarmonizedValues = function (root) {
  const out = [];
  if (isObj(root) && Array.isArray(root.harmonized_values)) for (const v of root.harmonized_values) if (typeof v === 'string' || typeof v === 'number') out.push(String(v));
  for (const { block } of Core.blocks(root)) for (const e of Core.valueMap(block)) if (isObj(e) && (typeof e.harmonized_value === 'string' || typeof e.harmonized_value === 'number')) out.push(String(e.harmonized_value));
  return uniq(out);
};

/* ── grain: what a source block's value is a fact about ── */
Core.blockGrain = function (root, block) {
  const label = Core.labelOf(root);
  let source = 'none', g = null;
  if (isObj(block) && isObj(block.loading_grain)) { source = 'block'; g = block.loading_grain; }
  else if (isObj(root) && isObj(root.loading_grain)) { source = 'element'; g = root.loading_grain; }
  const out = { source, label };
  if (g) {
    const anchor = str(g.anchor), entity = str(g.entity), attribute = str(g.attribute);
    const ent = K.ENTITY[entity];
    let a = K.ANCHOR[anchor];
    if (entity === 'participant_visit' && anchor === 'participant_id') a = { procedure: 'A visit', help: 'the visit, which mints participant_id together with the visit name as the study writes it' };
    out.anchor = anchor; out.entity = entity; out.attribute = attribute;
    out.procedure = a ? a.procedure : '';
    out.procHelp = a ? a.help : (anchor ? 'not known for the identifier ' + anchor : 'no anchor declared');
    out.anchorHelp = anchor ? 'the identifier that procedure minted; the key of the row this value is written to' : 'not declared';
    out.entityNoun = ent ? ent.noun : entity.replace(/_/g, ' ');
    out.entityHelp = entity ? (ent ? ent.help : 'the Layer 1 table named ' + entity) : 'not declared';
    out.level = ent ? ent.level : (entity ? 'unknown' : null);
    out.attrHelp = "this element; the column in that table that receives the harmonized value";
    out.attrMatches = !attribute || attribute === label;
    const procedure = out.procedure || 'The procedure that produced it';
    out.readsAs = (anchor && entity)
      ? procedure + ' minted ' + anchor + ' → ' + anchor + ' names one ' + out.entityNoun + ' → that ' + out.entityNoun + "'s row in the Layer 1 " + entity + ' table gets one ' + (attribute || label) + ' value.'
      : 'Incomplete: ' + (!anchor ? 'no anchor' : '') + (!anchor && !entity ? ' and ' : '') + (!entity ? 'no entity' : '') + ' declared.';
    const attr = attribute || label;
    const besides = [];
    const l1 = isObj(block) && isObj(block.layer_1_etl) ? block.layer_1_etl : {};
    if (str(l1.unit) || (isObj(root) && str(root.unit))) besides.push(attr + '_unit');
    const vm = Core.valueMap(block);
    if (vm.some(e => isObj(e) && e.harmonized_curie)) besides.push(attr + '_curie');
    if (vm.some(e => isObj(e) && e.harmonized_encoding !== null && e.harmonized_encoding !== undefined && e.harmonized_encoding !== '')) besides.push(attr + '_code');
    out.besides = besides;
  } else if (isObj(root) && Array.isArray(root.one_per) && root.one_per.length) {
    out.source = 'one_per';
    out.onePer = root.one_per.map(str);
    const lv = out.onePer.map(x => K.ONE_PER_LEVEL[x]).filter(Boolean);
    out.level = lv.includes('specimen') ? 'specimen' : lv.includes('visit') ? 'visit' : lv.includes('participant') ? 'participant' : 'unknown';
    out.readsAs = 'Only the older one_per field is set (' + out.onePer.join(', ') + '): one value per ' + out.onePer.join(' per ') +
      '. No anchor, entity or attribute is declared, so the file does not say which Layer 1 table the value lands on.';
  } else {
    out.readsAs = 'No grain is declared on this block or for the file.';
  }
  return out;
};

/* ── keys: what each Layer 2 row hangs on ── */
const KEY_ROWS = ['person_id', 'visit_occurrence_id', 'specimen_id'];
Core.targetKeys = function (root, target) {
  const at = isObj(target) ? target.anchored_to : undefined;
  const table = isObj(target) ? str(target.table) || 'CDM' : 'CDM';
  const grains = Core.blocks(root).map(x => Core.blockGrain(root, x.block));
  const anchors = uniq(grains.map(g => g.anchor || ''));
  const res = { table, shape: 'object', rows: [], grains };
  if (Array.isArray(at)) { res.shape = 'list'; return res; }
  if (!isObj(at)) { res.shape = at === undefined || at === null ? 'missing' : 'other'; return res; }
  const keys = uniq(KEY_ROWS.concat(Object.keys(at)));
  const anchorTxt = anchors.length === 1 ? anchors[0] : anchors.length ? anchors.join(' / ') : '';
  for (const k of keys) {
    const present = Object.prototype.hasOwnProperty.call(at, k);
    const from = present ? str(at[k]) : '';
    let explain;
    if (k === 'person_id') explain = present
      ? (anchorTxt === 'participant_id'
        ? "the loader takes the row's participant_id (the source block's anchor) and looks up its CDM person key in " + (from || 'the participant identity map')
        : "the loader looks up the CDM person key of the participant the row belongs to" + (anchorTxt ? ' (the row is keyed by ' + anchorTxt + ')' : '') + ', in ' + (from || 'the participant identity map'))
      : 'not set. Every target needs it: the CDM person key, resolved through the participant identity map.';
    else if (k === 'visit_occurrence_id') explain = present
      ? 'looked up in ' + (from || 'the visit table') + ' by participant and the visit name as the study writes it'
      : 'not set. Add when the fact belongs to a visit: looked up by participant and the visit name as the study writes it.';
    else if (k === 'specimen_id') explain = present
      ? "the row's specimen or sample identifier, looked up in " + (from || 'the specimen map')
      : 'not set. Add when the fact belongs to a specimen or sample: its identifier looked up in the specimen map.';
    else explain = present ? 'resolved from ' + (from || '(nothing named)') : '';
    res.rows.push({ key: k, present, from, explain });
  }
  const has = k => Object.prototype.hasOwnProperty.call(at, k);
  res.level = has('specimen_id') ? 'specimen' : has('visit_occurrence_id') ? 'visit' : has('person_id') ? 'participant' : 'none';
  const per = { specimen: 'per specimen', visit: 'per participant per visit', participant: 'per participant', none: '' }[res.level];
  res.resultText = res.level === 'none' ? 'No keys set: the loader has nothing to hang the rows on.' : 'Keys set: ' + Object.keys(at).filter(k => at[k] !== null && at[k] !== '').join(' + ') + ' → one ' + table + ' row ' + per + '.';
  const levels = uniq(grains.map(g => g.level || ''));
  const need = { participant: 'participant', visit: 'visit', specimen: 'specimen', sample: 'specimen' };
  if (!levels.length) res.check = { status: 'unknown', text: 'No grain is declared on the source blocks, so the keys cannot be checked against it.' };
  else if (levels.some(l => l === 'unknown' || l === 'file')) res.check = { status: 'unknown', text: 'The blocks land on ' + uniq(grains.map(g => g.entity || '')).join(', ') + '; no rule here says which keys that needs.' };
  else {
    const wanted = uniq(levels.map(l => need[l]));
    const desc = uniq(grains.map(g => g.source === 'one_per' ? 'one_per ' + g.onePer.join('+') : (g.anchor + ' → ' + g.entity))).join('; ');
    if (wanted.length === 1 && wanted[0] === res.level) res.check = { status: 'ok', text: 'Agrees with the source blocks (' + desc + ').' };
    else {
      const t = wanted.length > 1
        ? 'The source blocks land at different grains (' + desc + '), so one set of keys cannot match all of them.'
        : 'The source blocks put values on ' + desc + ' (one value ' + ({ participant: 'per participant', visit: 'per participant per visit', specimen: 'per specimen or sample' }[wanted[0]]) + '), but these keys give one row ' + per + '.';
      res.check = { status: 'warn', text: t };
    }
  }
  return res;
};

Core.conceptDomainCheck = function (target) {
  if (!isObj(target) || !isObj(target.defining_concept_id)) return null;
  const c = target.defining_concept_id;
  const field = str(c.target_field), table = str(target.table), domain = str(c.domain);
  const allowed = Core.allowedDomains(field) || K.TABLE_DOMAIN[table] || null;
  if (!domain) return { status: 'unknown', text: 'No domain written on the concept.' };
  if (!allowed) return { status: 'unknown', text: 'No domain rule known for ' + (field || table) + '.' };
  return allowed.includes(domain)
    ? { status: 'ok', text: 'domain ' + domain + ' fits ' + (field || table) }
    : { status: 'warn', text: 'domain ' + domain + ' is written to ' + (field || table) + ' (expects ' + allowed.join(' / ') + ')' };
};

/* ── Layer 2 value map grid for one target ── */
Core.l2Grid = function (root, target) {
  const vm = isObj(target) && Array.isArray(target.value_map) ? target.value_map : [];
  const declared = isObj(root) && Array.isArray(root.harmonized_values) ? root.harmonized_values.map(v => String(v)) : [];
  const hvs = Core.allHarmonizedValues(root);
  const entryHv = [];
  vm.forEach((e, i) => { if (isObj(e)) entryHv.push([String(e.harmonized_value), i]); });
  const order = uniq(hvs.concat(entryHv.map(x => x[0])));
  const table = isObj(target) ? str(target.table) : '';
  const cols = K.CDM[table] || null;
  const keysSeen = [];
  vm.forEach(e => { if (isObj(e)) for (const k of Object.keys(e)) if (k !== 'harmonized_value' && k !== 'note' && !keysSeen.includes(k)) keysSeen.push(k); });
  const ordered = K.L2_VALUE_KEYS_ORDER.filter(k => keysSeen.includes(k)).concat(keysSeen.filter(k => !K.L2_VALUE_KEYS_ORDER.includes(k)));
  const hasNote = vm.some(e => isObj(e) && 'note' in e);
  const columns = ordered.map(k => ({ key: k, isColumn: cols ? (cols.includes(k) || k.startsWith('_')) : null }));
  if (hasNote) columns.push({ key: 'note', isColumn: true, isNote: true });
  const rows = [];
  for (const hv of order) {
    const idxs = entryHv.filter(x => x[0] === hv).map(x => x[1]);
    if (!idxs.length) rows.push({ hv, entryIndex: null, flags: ['missing'] });
    idxs.forEach(i => {
      const flags = [];
      if (idxs.length > 1) flags.push('duplicate');
      if (declared.length && !declared.includes(hv) && hv !== '<any in range>') flags.push('undeclared');
      rows.push({ hv, entryIndex: i, flags });
    });
  }
  vm.forEach((e, i) => { if (!isObj(e)) rows.push({ hv: '(not an object)', entryIndex: i, flags: ['malformed'] }); });
  return { rows, columns, table, knownTable: !!cols, cdmColumns: cols || [] };
};
Core.l2ByValue = function (root) {
  const tg = Core.targets(root);
  const hvs = uniq(Core.allHarmonizedValues(root).concat(...tg.map(t => (isObj(t) && Array.isArray(t.value_map) ? t.value_map : []).filter(isObj).map(e => String(e.harmonized_value)))));
  return hvs.map(hv => ({
    hv,
    landings: tg.map((t, ti) => {
      if (!isObj(t)) return null;
      const vm = Array.isArray(t.value_map) ? t.value_map : [];
      const idx = vm.findIndex(e => isObj(e) && String(e.harmonized_value) === hv);
      return { ti, table: str(t.table), targetId: str(t.target_id), entryIndex: idx >= 0 ? idx : null, entry: idx >= 0 ? vm[idx] : null };
    }).filter(Boolean)
  }));
};

/* ── summary of one file (library, clusters, search) ── */
Core.summarize = function (id, root) {
  const name = id.split('/').pop();
  const s = {
    id, name, dir: id.includes('/') ? id.slice(0, id.lastIndexOf('/')) : '', label: Core.labelOf(root, name), schema: '', programs: [],

function diffEl(aText, bText) {

  if (!d.changed) return h('div', { class: 'sub2' }, 'No differences: Save would write the file exactly as it is on disk.');
  const box = h('div', { class: 'diff' });
  const ops = d.ops;
  const ctx = 3;
  const keep = new Array(ops.length).fill(false);
  ops.forEach((o, i) => { if (o.t !== '=') for (let j = Math.max(0, i - ctx); j <= Math.min(ops.length - 1, i + ctx); j++) keep[j] = true; });
  let skipping = false;
  if (d.prefix > 0) box.append(h('div', { class: 'h' }, '… ' + d.prefix + ' unchanged lines'));
  ops.forEach((o, i) => {
    if (!keep[i]) { if (!skipping) { box.append(h('div', { class: 'h' }, '…')); skipping = true; } return; }
    skipping = false;
    const num = o.t === '+' ? o.b + 1 : o.a + 1;
    box.append(h('div', { class: o.t === '+' ? 'a' : o.t === '-' ? 'd' : '' }, (o.t === '=' ? ' ' : o.t) + String(num).padStart(5) + '  ' + o.line));

    async list() { listing = await getJSON('/registry/list'); store.name = listing.name; store.where = listing.registry; return entries(listing.files, 'registry'); },
    async listStaged() { if (!listing) await store.list(); return entries(listing.staged, 'staged'); },

async function loadStore(store) {

}

}

/* ── top bar, center, render loop ── */
function renderTop() {
  const tabs = $('#tabs');
  if (!tabs) return;
  tabs.replaceChildren(
    h('button', { class: S.tab === 'files' ? 'on' : '', onclick: () => { S.tab = 'files'; scheduleRender(); } }, 'Files'),
    h('button', { class: S.tab === 'clusters' ? 'on' : '', onclick: () => { S.tab = 'clusters'; scheduleRender(); } }, 'Clusters'));
  const pill = $('#relay');

  pill.textContent = 'OMOP Hub: ' + ({ ok: 'ready', nokey: 'relay has no API key', down: 'relay not running', unknown: 'checking …' }[st] || st);
  $('#folder').textContent = S.rootName ? S.rootName + (S.mode === 'ro' ? ' (read-only)' : '') : '';

}
function welcomeEl() {

  if (!window.showDirectoryPicker) w.append(h('p', { class: 'banner warn' }, 'This browser cannot write to a folder (no File System Access API). The folder opens read-only; use Chrome or Edge to save.'));
  w.append(h('p', null, 'Concept search goes to OMOP Hub through a small relay on this computer, because OMOP Hub refuses requests made directly from a web page. Start it from the folder that holds this page and your .env:'),
    h('p', null, h('code', null, 'python cde_registry_browser_relay.py'), ' — then open ', h('code', null, 'http://127.0.0.1:8765/'), ' (or keep using this page).'));

}
function renderCenter() {
  const c = $('#center');
  if (!c) return;
  const sig = S.tab + '|' + (S.tab === 'files' ? S.current + '|' + S.compare + '|' + S.sheet.raw : '');
  const same = S._sig === sig;
  const keep = {};
  if (same) { keep.__c = c.scrollTop; $$('[data-keep-scroll]', c).forEach(el => { keep[el.getAttribute('data-keep-scroll')] = el.scrollTop; }); }
  else if (S._sig) S.sheet.scroll[S._sig] = c.scrollTop;
  let content;
  let split = false;
  if (S.tab === 'clusters') content = S.files.size ? renderClusters() : welcomeEl();
  else if (!S.files.size || S.loading) content = welcomeEl();
  else {
    const F = curFile();
    const G = S.compare ? S.files.get(S.compare) : null;
    if (!F) content = overviewEl();
    else if (G) {
      split = true;
      content = h('div', { class: 'split' }, h('div', { class: 'pane', 'data-keep-scroll': 'pane1' }, sheetFor(F, 'main')), h('div', { class: 'pane', 'data-keep-scroll': 'pane2' }, sheetFor(G, 'compare')));
    } else content = sheetFor(F, 'main');

  c.classList.toggle('splitmode', split || S.tab === 'clusters');

  if (same) { c.scrollTop = keep.__c; $$('[data-keep-scroll]', c).forEach(el => { const k = el.getAttribute('data-keep-scroll'); if (k in keep) el.scrollTop = keep[k]; }); }

}
function overviewEl() {
  const files = Array.from(S.files.values());

  const gaps = files.filter(F => F.gaps && F.gaps.missing);
  return h('div', { class: 'welcome' }, h('h2', null, S.rootName),
    h('p', null, files.length + ' mapping files. Pick one in the library, press ', h('span', { class: 'kbd' }, 'j'), ' to start at the top, or ', h('span', { class: 'kbd' }, '/'), ' to search every file.'),
    h('ul', null,
      h('li', null, n(F => F.sum.schema === 'harmonized-element/2.7') + ' on schema 2.7, ' + n(F => F.sum.schema === 'harmonized-element/2.5') + ' on 2.5'),

function afterRender() {

function renderAll() {

}

/* ── keyboard + wiring ── */
function onKey(ev) {
  const t = ev.target;
  const tag = (t && t.tagName || '').toLowerCase();
  const inField = tag === 'input' || tag === 'textarea' || tag === 'select' || (t && t.isContentEditable);
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === 's') {
    ev.preventDefault();
    if (S.editing) S.editing.commit();
    if (ev.shiftKey) saveAll(); else saveFile(curFile());
    return;
  }
  if (inField) return;
  if (mod && ev.key.toLowerCase() === 'z') { ev.preventDefault(); if (ev.shiftKey) redo(curFile()); else undo(curFile()); return; }
  if (mod && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(curFile()); return; }
  if (mod || ev.altKey) return;
  if (ev.key === '/') { ev.preventDefault(); const s = $('#search'); s.focus(); s.select(); }
  else if (ev.key === 'j') { ev.preventDefault(); step(1); }
  else if (ev.key === 'k') { ev.preventDefault(); step(-1); }
  else if (ev.key === 'Escape') { closePop(); hideResults(); }
}
async function init() {
  document.addEventListener('keydown', onKey);
  document.addEventListener('mousedown', ev => {
    const pop = $('#pop');
    if (!pop.hidden && !pop.contains(ev.target) && !ev.target.closest('.modalbg')) closePop();
    if (!ev.target.closest('.searchwrap')) hideResults();
  }, true);
  window.addEventListener('beforeunload', ev => { if (anyDirty()) { ev.preventDefault(); ev.returnValue = ''; } });
  const search = $('#search');
  let timer = null;
  search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(showResults, 140); });
  search.addEventListener('focus', () => { if (search.value.trim()) showResults(); });
  search.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); moveResult(1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); moveResult(-1); }
    else if (ev.key === 'Enter') { ev.preventDefault(); clearTimeout(timer); if ($('#results').hidden) showResults(); chooseResult(_sr.hi); }
    else if (ev.key === 'Escape') { hideResults(); search.blur(); }
  });
  $('#openfolder').addEventListener('click', openFolder);
  $('#saveall').addEventListener('click', saveAll);
  $('#relay').addEventListener('click', async () => {
    const r = await Relay.health();
    if (r.status === 'ok') { toast('OMOP Hub relay is running at ' + r.base, 'ok'); return; }
    modal('OMOP Hub relay', h('div', null,
      h('p', null, r.status === 'nokey' ? 'The relay is running but found no OMOPHUB_API_KEY (environment variable, or a .env file next to the relay script).' : 'The relay is not running. OMOP Hub refuses requests made straight from a web page, so concept search goes through a small program on this computer.'),
      h('p', null, 'Start it in the folder that holds this page and your .env:'), h('pre', { class: 'mono' }, 'python cde_registry_browser_relay.py'),
      h('p', null, 'It listens on 127.0.0.1:8765 only. Relay address: ', (() => { const i = h('input', { type: 'text', value: LS.get('relay', '') || 'http://127.0.0.1:8765', style: 'width:260px' }); i.addEventListener('change', () => { LS.set('relay', i.value.trim()); Relay.health(); }); return i; })())),
    [{ label: 'Close', value: null }]);
  });
  const lf = $('#libfilter');
  lf.addEventListener('input', () => { S.lib.filter = lf.value; S.clCache = null; renderLibrary(); });
  lf.addEventListener('keydown', ev => { if (ev.key === 'Enter') { const ids = libraryOrder(); if (ids.length) openFile(ids[0]); } if (ev.key === 'Escape') { lf.value = ''; S.lib.filter = ''; renderLibrary(); lf.blur(); } });
  const lg = $('#libgroup');
  lg.replaceChildren(...Object.entries(GROUPS).map(([k, g]) => { const o = h('option', { value: k }, g[0]); if (k === S.lib.groupBy) o.selected = true; return o; }));
  lg.addEventListener('change', () => { S.lib.groupBy = lg.value; LS.set('groupBy', lg.value); renderLibrary(); });
  $('#libedited').addEventListener('change', ev => { S.lib.onlyEdited = ev.target.checked; renderLibrary(); });
  $('#dirinput').addEventListener('change', ev => { if (ev.target.files && ev.target.files.length) loadReadOnly(ev.target.files); ev.target.value = ''; });
  renderAll();
  Relay.health();
  const token = relayServedToken();
  if (token) { await loadStore(relayStore(location.origin, token)); return; }
  const hd = await kvGet('root');
  if (hd && hd.name) {
    S.remembered = hd.name;
    try { if ((await hd.queryPermission({ mode: 'readwrite' })) === 'granted') { await loadFolder(hd); return; } } catch (e) { /* ask on click */ }

}
window.CDEB = { S, C, get files() { return S.files; }, loadFolder, loadStore, stageTarget, openFile, saveFile, saveAll, scrollToPath, runSearch, undo, redo, revertAll, revertChange, setPath, fileById, currentText, renderNow: () => renderAll() };
init();
